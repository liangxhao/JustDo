<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PRODUCT_NAME__ Chat</title>
    <link rel="stylesheet" href="appearance.css" />
    <link rel="stylesheet" href="sidepanel.css" />
    <link rel="stylesheet" href="modules/sidepanel-rich-content.css" />
  </head>
  <body>
    <header>
      <div class="brand" title="__PRODUCT_NAME__"><img src="icons/icon32.png" alt="" /></div>
      <div class="conversation-picker">
        <select id="session" aria-label="Conversation" data-i18n-aria-label="conversation">
          <option value="" data-i18n="newChat">New chat</option>
        </select>
      </div>
      <div class="header-actions">
        <button
          id="processDetails"
          class="icon"
          type="button"
          title="Expand all process details"
          aria-label="Expand all process details"
          aria-pressed="false"
          aria-controls="messages"
          data-i18n-title="expandAllProcessDetails"
          data-i18n-aria-label="expandAllProcessDetails"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9.5 4.5A2.5 2.5 0 0 0 5 6a3 3 0 0 0-1.25 5.55A3.5 3.5 0 0 0 6 17.5a3 3 0 0 0 5 1.8V6.5a2 2 0 0 0-1.5-2Z"
            />
            <path
              d="M14.5 4.5A2.5 2.5 0 0 1 19 6a3 3 0 0 1 1.25 5.55A3.5 3.5 0 0 1 18 17.5a3 3 0 0 1-5 1.8V6.5a2 2 0 0 1 1.5-2Z"
            />
            <path
              d="M7 8.5c1.1 0 2 .9 2 2M17 8.5c-1.1 0-2 .9-2 2M7 15c1.1 0 2-.9 2-2M17 15c-1.1 0-2-.9-2-2"
            />
          </svg>
        </button>
        <button
          id="refresh"
          class="icon"
          type="button"
          title="Refresh"
          aria-label="Refresh"
          data-i18n-title="refresh"
          data-i18n-aria-label="refresh"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7v5h-5M20 12a8 8 0 1 0-2.34 5.66M20 12a8 8 0 0 0-2.34-5.66" />
          </svg>
        </button>
        <button
          id="settings"
          class="icon"
          type="button"
          title="Pairing settings"
          aria-label="Pairing settings"
          data-i18n-title="settings"
          data-i18n-aria-label="settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.73v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.73l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </header>
    <main id="messages" tabindex="0" aria-label="Conversation" data-i18n-aria-label="conversation">
      <div class="empty">
        <img src="icons/icon128.png" alt="" />
        <h1 data-i18n="welcome">What can I help with?</h1>
      </div>
    </main>
    <div class="latest-anchor">
      <button id="latest" type="button" class="latest-button hidden" data-i18n="latest">
        Back to latest
      </button>
    </div>
    <div id="runActivity" class="run-activity hidden"></div>
    <p id="error" class="error hidden" role="alert"></p>
    <footer>
      <div class="composer">
        <div id="attachments" class="attachments hidden" aria-live="polite"></div>
        <textarea
          id="prompt"
          rows="2"
          placeholder="Do anything"
          aria-label="Do anything"
          data-i18n-placeholder="prompt"
          data-i18n-aria-label="prompt"
        ></textarea>
        <div class="composer-toolbar">
          <button
            id="attach"
            class="composer-action"
            type="button"
            title="Attach files"
            aria-label="Attach files"
            data-i18n-title="attach"
            data-i18n-aria-label="attach"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <input id="fileInput" type="file" multiple hidden />
          <label
            class="context-toggle"
            title="Include page context (active page title, URL, visible text, and selected text)"
            data-i18n-title="includePageHint"
          >
            <input
              id="includePage"
              type="checkbox"
              aria-label="Include page context"
              data-i18n-aria-label="includePage"
              checked
            />
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3h7l4 4v14H7V3Z" />
              <path d="M14 3v5h5M10 12h5M10 16h5" />
            </svg>
            <span class="visually-hidden" data-i18n="pageContext">Page context</span>
          </label>
          <label class="select-control permission-control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 5 6v5c0 4.6 2.9 8.1 7 10 4.1-1.9 7-5.4 7-10V6l-7-3Z" />
            </svg>
            <select
              id="permission"
              aria-label="Permission mode"
              data-i18n-aria-label="permission"
              disabled
            >
              <option value="ask" data-i18n="ask">Ask for approval</option>
              <option value="auto" data-i18n="auto">Smart approval</option>
              <option value="full" data-i18n="full">Full access</option>
            </select>
          </label>
          <span class="toolbar-spacer"></span>
          <label class="select-control model-control">
            <select id="model" aria-label="Model" data-i18n-aria-label="model" disabled>
              <option value="" data-i18n="defaultModel">Default model</option>
            </select>
          </label>
          <button
            id="send"
            class="send-button"
            type="button"
            title="Send"
            aria-label="Send"
            data-i18n-title="send"
            data-i18n-aria-label="send"
            disabled
          >
            <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 12 6-6 6 6M12 7v11" />
            </svg>
            <span class="stop-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </footer>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
