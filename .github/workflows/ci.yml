name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ========== Stage 1: 变更检测 ==========
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      renderer: ${{ steps.changes.outputs.renderer }}
      main: ${{ steps.changes.outputs.main }}
      skills: ${{ steps.changes.outputs.skills }}
      scripts: ${{ steps.changes.outputs.scripts }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            renderer:
              - 'src/renderer/**'
              - 'plugins/extensions/**'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tailwind.config.js'
              - 'postcss.config.js'
            main:
              - 'src/main/**'
              - 'plugins/extensions/**'
              - 'src/common/**'
              - 'electron-tsconfig.json'
              - 'src/main/preload.ts'
            skills:
              - 'plugins/skills/**'
            scripts:
              - 'scripts/**'
              - 'electron-builder.json'
            docs:
              - 'docs/**'
              - '**/*.md'

  # ========== Stage 2: 代码质量 (快速) ==========
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - run: npm run lint

  # ========== Stage 3: Renderer 构建 ==========
  build-renderer:
    needs: [changed-files, lint]
    if: ${{ needs.changed-files.outputs.renderer == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-dist
          path: dist/
          retention-days: 1

  # ========== Stage 4: Main 进程构建 ==========
  build-main:
    needs: [changed-files, lint]
    if: ${{ needs.changed-files.outputs.main == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - run: npm run compile:electron
      - uses: actions/upload-artifact@v4
        with:
          name: main-dist
          path: dist-electron/
          retention-days: 1

  # ========== Stage 5: Skill 校验 ==========
  build-skills:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.skills == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - name: Verify bundled skill sources and synchronization
        run: node node_modules/vitest/vitest.mjs run tests/scripts/sync-bundled-skills.test.ts

  # ========== Stage 6: 测试 (Node.js 内置) ==========
  test:
    needs: [build-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - run: npm test
