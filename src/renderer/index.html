<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PRODUCT_NAME%</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      %STARTUP_THEME_STYLES%
      html { background-color: var(--justdo-background); }
      %STARTUP_STYLES%
    </style>
    <script>
      %STARTUP_THEME_SCRIPT%
    </script>
  </head>
  <body>
    <div id="root"></div>
    <template id="first-launch-document-template">%FIRST_LAUNCH_DOCUMENT%</template>
    <template id="startup-document-template">%STARTUP_DOCUMENT%</template>
    <script>
      // Select the process's fixed mode synchronously, before application modules load.
      (function () {
        const dictionaries = %STARTUP_TRANSLATIONS%;
        const firstLaunch = window.electron?.initialization?.firstLaunch === true;
        const migration = window.electron?.initialization?.route === 'migration';
        const upgrade = window.electron?.initialization?.route === 'upgrade';
        const entryAt = window.electron?.initialization?.entryStartedAt;
        if (Number.isFinite(entryAt)) document.documentElement.setAttribute('data-startup-entry-started-at', String(entryAt));
        const template = document.getElementById(firstLaunch ? 'first-launch-document-template' : 'startup-document-template');
        document.getElementById('root').appendChild(template.content.cloneNode(true));
        let language = navigator.language.startsWith('zh') ? 'zh' : 'en';
        try {
          const config = JSON.parse(localStorage.getItem('app_config') || '{}');
          if (config.language === 'zh' || config.language === 'en') language = config.language;
        } catch { /* Main preferences are hydrated by main.tsx. */ }
        document.documentElement.lang = language;
        const copy = dictionaries[language];
        const startup = document.getElementById('startup-document');
        if (migration || upgrade) {
          startup.dataset.startupView = migration ? 'migration' : 'upgrade';
          for (const element of startup.querySelectorAll(migration
            ? '[data-migration-only],[data-migration-history]' : '[data-upgrade-only]')) element.hidden = false;
          const list = startup.querySelector('nav ol');
          [...list.children].filter(item => !item.hidden).forEach((item, index) => item.firstElementChild.textContent = String(index + 1).padStart(2, '0'));
          const caption = startup.querySelector('[data-startup-copy="initializationWelcome"]');
          caption.dataset.startupCopy = migration ? 'initializationUpgradeWelcome' : 'initializationNormalUpgradeWelcome';
          startup.querySelector('h1').dataset.startupCopy = migration ? 'initializationUpgradeTitle' : 'initializationNormalUpgradeTitle';
          document.getElementById('startup-document-hint').dataset.startupCopy = migration ? 'initializationUpgradeDescription' : 'initializationNormalUpgradeDescription';
          if (upgrade) {
            startup.querySelector('[data-startup-copy="initializationUserData"]').dataset.startupCopy = 'initializationRetainedData';
            document.getElementById('startup-operation').dataset.startupCopy = 'initializationActivity_nativeInspect';
            document.getElementById('startup-operation-detail').dataset.startupCopy = 'initializationActivity_nativeInspectDescription';
          }
        }
        %STARTUP_MOTION_SCRIPT%
        startup.querySelectorAll('[data-startup-copy]').forEach(element => {
          element.textContent = copy[element.dataset.startupCopy];
        });
        startup.querySelectorAll('[data-startup-label]').forEach(element => {
          element.setAttribute('aria-label', copy[element.dataset.startupLabel]);
        });
        startup.querySelectorAll('[data-startup-control]').forEach(button => {
          button.hidden = window.electron?.platform !== 'win32';
          button.addEventListener('click', () => window.electron?.window?.[button.dataset.startupControl]?.());
        });
        document.getElementById('startup-reload').addEventListener('click', () => window.location.reload());
        %STARTUP_FAILURE_SCRIPT%
        let startedAt;
        // The motion clock begins at first paint; backend elapsed time comes
        // only from Main's existing read-only startup snapshot.
        window.electron?.initialization?.getState?.().then(state => {
          if (Number.isFinite(state?.startedAt)) startedAt = state.startedAt;
        }).catch(() => { /* The initialization Gate owns snapshot failures. */ });
        let activityStartedAt = Date.now();
        let activity;
        let failedAt;
        const timer = window.setInterval(() => {
          if (!startup.isConnected) {
            window.clearInterval(timer);
            return;
          }
          const failed = startup.dataset.failed === 'true';
          if (failed && !failedAt) failedAt = Date.now();
          const clock = failedAt || Date.now();
          const seconds = Number.isFinite(startedAt) ? Math.max(0, Math.floor((clock - startedAt) / 1000)) : 0;
          document.getElementById('startup-clock').textContent =
            String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
          if (startup.dataset.activity) {
            if (activity !== startup.dataset.activity) {
              activity = startup.dataset.activity;
              activityStartedAt = clock;
            }
            const key = (firstLaunch && !upgrade ? 'initializationRenderer_' : 'startupRenderer_') + activity;
            document.getElementById('startup-operation').textContent = copy[key];
            document.getElementById('startup-operation-detail').textContent = copy[key + 'Description'];
          }
          document.getElementById('startup-document-error').hidden = !failed;
          startup.querySelector('[data-bootstrap-progress]').hidden = failed;
          const waiting = Math.floor((clock - activityStartedAt) / 1000);
          const hint = document.getElementById('startup-document-hint');
          hint.dataset.waiting = String(!failed && waiting >= 30);
          hint.textContent = copy[waiting >= 30 && !failed
            ? (firstLaunch ? 'initialization' : 'startup') + (waiting >= 90 ? 'ExtendedWait' : 'LongWait')
            : migration ? 'initializationUpgradeDescription' : upgrade ? 'initializationNormalUpgradeDescription' : firstLaunch ? 'firstLaunchDescription' : 'startupContinue'];
        }, 1000);
      })();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
