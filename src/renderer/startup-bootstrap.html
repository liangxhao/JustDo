<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PRODUCT_NAME%</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #f8f9fb; color: #252a35; font-family: system-ui, sans-serif; }
      body { display: grid; place-items: center; }
      main { display: grid; justify-items: center; gap: 18px; }
      img { width: 64px; height: 64px; }
      h1 { margin: 0; font-size: 24px; font-weight: 600; }
      p { margin: 0; color: #667085; font-size: 14px; }
      .progress { width: 180px; height: 3px; overflow: hidden; background: #e2e6ef; border-radius: 3px; }
      .progress::after { content: ''; display: block; height: 100%; width: 40%; background: #5a78ff; animation: loading 1.2s ease-in-out infinite; }
      @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { .progress::after { animation: loading 1.2s ease-in-out infinite; } }
    </style>
  </head>
  <body>
    <main aria-busy="true">
      <img src="%STARTUP_BOOTSTRAP_LOGO%" alt="" width="64" height="64" loading="eager" decoding="sync" />
      <h1>%PRODUCT_NAME%</h1>
      <p id="startup-label">%STARTUP_COPY_startupBootstrap%</p>
      <div class="progress" aria-hidden="true"></div>
    </main>
    <script>
      const language = navigator.language.startsWith('zh') ? 'zh' : 'en';
      document.documentElement.lang = language;
      document.getElementById('startup-label').textContent = (%STARTUP_TRANSLATIONS%)[language].startupBootstrap;
    </script>
  </body>
</html>
