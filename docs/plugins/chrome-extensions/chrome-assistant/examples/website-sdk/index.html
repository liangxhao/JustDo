<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网页调用 Chrome 扩展示例</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      body {
        max-width: 46rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      section {
        border: 1px solid GrayText;
        border-radius: 0.5rem;
        margin: 1rem 0;
        padding: 1rem;
      }
      button {
        font: inherit;
        padding: 0.3rem 0.8rem;
      }
      [data-status],
      pre {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      pre {
        background: Canvas;
        border-left: 3px solid GrayText;
        padding-left: 0.75rem;
      }
    </style>
    <script defer src="./chrome-assistant.js"></script>
    <script defer src="./demo.js"></script>
  </head>
  <body>
    <main>
      <h1 data-copy="title">网页调用 Chrome 扩展示例</h1>
      <p data-copy="record"></p>
      <section data-mode="draft">
        <button type="button" data-copy="draft" disabled></button>
        <p data-copy="draftHelp"></p>
        <p data-status role="status"></p>
        <pre data-result hidden></pre>
      </section>
      <section data-mode="send">
        <button type="button" data-copy="send" disabled></button>
        <p data-copy="sendHelp"></p>
        <p data-status role="status"></p>
        <pre data-result hidden></pre>
      </section>
    </main>
  </body>
</html>
