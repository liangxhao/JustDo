general_settings:
  custom_auth: hooks.jwt_auth.handler.user_api_key_auth
  custom_auth_run_common_checks: true
  disable_prisma_schema_update: true

  coordination_redis:
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # Per-worker Prisma pool; timeout is time spent waiting for a pool connection.
  database_connection_pool_limit: 4
  database_connection_timeout: 30
  proxy_batch_write_at: 60

  store_prompts_in_spend_logs: true
  disable_spend_logs: false
  disable_error_logs: false
  maximum_spend_logs_retention_period: '30d'
  maximum_spend_logs_retention_interval: '1d'

  forward_client_headers_to_llm_api: true
  always_include_stream_usage: true
  user_header_name: X-User-Account
  user_header_mappings:
    - header_name: X-User-Account
      litellm_user_role: customer

litellm_settings:
  enable_preview_features: true
  drop_params: true
  set_verbose: false
  json_logs: true
  request_timeout: 1800

router_settings:
  timeout: 1800
  stream_timeout: 1800
  num_retries: 2
